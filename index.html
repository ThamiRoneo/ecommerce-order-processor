<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Order Processor</title>
    <meta name="theme-color" content="#f6f7f8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body  class="min-h-screen bg-[#f6f7f8] text-slate-800 antialiased">
    <div class="min-h-screen lg:grid lg:grid-cols-[14rem_minmax(0,1fr)]">
        <aside class="border-b border-slate-200 bg-white px-5 py-5 lg:min-h-screen lg:border-b-0 lg:border-r ;g:px-4 lg:py-7">
            <a href="#main-content" class="flex w-fit items-center gap-3 rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-amber-400">
                <span class="grid size-9 place-items-center bg-emrald-800 text-sm font-semibold text-blue" aria-hidden="true">E</span>
                <span>
                    <span class="block text-sm font-semibold tracking-wide text-slate-900">EVERYDAY</span>
                    <span class="block text-xs text-slate-500">Commerce operations</span>
                </span>
            </a>

            <nav class="mt-12" aria-label="Main navigation">
                <p class="mb-3 hidden px-3 text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-400 lg:block">Workspace</p>
                <ul class="flex min-w-max gap-1 pb-1 lg:min-w-0 lg:flex-col lg:px-0 lg:pb-0">
                	<li><a href="#orders" aria-current="page" class="block border-b-2 border-emerald-800 bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-950 lg:border-b-0 lg:border-1-2 lg:py-2.5">Orders</a></li>
                	<li><a href="#search-filter" class="block border-b-2 border-transparent px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-950 focus-visible:outline-2 focus-visible:outline-emerald-700 lg:border-b-0 lg:border-l-2 lg:py-2.5">Search / Filter</a></li>
                	<li><a href="#statistics" class="block border-b-2 border-transparent px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-950 focus-visible:outline-2 focus-visible:outline-emerald-700 lg:border-b-0 lg:border-l-2 lg:py-2.5">Statistics</a></li>
                	<li><a href="#categories" class="block border-b-2 border-transparent px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-950 focus-visible:outline-2 focus-visible:outline-emerald-700 lg:border-b-0 lg:border-l-2 lg:py-2.5">Categories</a></li>
                	<li><a href="#product-lookup" class="block border-b-2 border-transparent px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-950 focus-visible:outline-2 focus-visible:outline-emerald-700 lg:border-b-0 lg:border-l-2 lg:py-2.5">Product Lookup</a></li>
                	<li><a href="#data-processing" class="block border-b-2 border-transparent px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-950 focus-visible:outline-2 focus-visible:outline-emerald-700 lg:border-b-0 lg:border-l-2 lg:py-2.5">Data Processing</a></li>
                </ul>
            </nav>

            <div>
                <p>Order processor</p>
                <p>Store workspace - Manage your store in one place.</p>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
